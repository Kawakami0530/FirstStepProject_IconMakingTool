<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="First Step Projectのコラボ告知画像をフルHDで作成。">
<title>コラボ画像メーカー | First Step Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@700&amp;family=Noto+Sans+JP:wght@400..800&amp;family=Noto+Serif+JP:wght@700&amp;family=Zen+Maru+Gothic:wght@700&amp;display=swap">
<link rel="stylesheet" href="style.css?v=10">
<script defer src="app.js?v=10"></script>
</head>
<body>
<main>
<header><p>First Step Project</p><h1>コラボ画像メーカー</h1></header>
<div class="workspace">
<section class="preview" aria-label="プレビュー">
<canvas id="preview" width="1920" height="1080" aria-label="コラボ告知画像のプレビュー"></canvas>
</section>
<section class="controls" aria-label="画像の設定">
<details class="panel" open>
<summary>背景</summary>
<div class="panel-fields">
<div id="presets" class="presets" role="group" aria-label="デフォルト背景"></div>
<label for="effect">背景エフェクト</label>
<select id="effect" autocomplete="off">
<option value="">なし</option>
<option value="sweep">光の曲線</option>
<option value="beam">斜めの光</option>
<option value="haze">光だまり</option>
<option value="prism">プリズム</option>
<option value="sparkles">きらめき</option>
</select>
</div>
</details>
<details class="panel" open>
<summary>ボーカル</summary>
<div class="panel-fields performer-fields">
<input id="vocal-name" type="text" autocomplete="off" aria-label="ボーカル名" placeholder="ボーカル名">
<input id="vocal" type="file" accept="image/*" aria-label="ボーカルのアイコン画像">
</div>
</details>
<details class="panel" open>
<summary>コンポーザー</summary>
<div class="panel-fields performer-fields">
<input id="composer-name" type="text" autocomplete="off" aria-label="コンポーザー名" placeholder="コンポーザー名">
<input id="composer" type="file" accept="image/*" aria-label="コンポーザーのアイコン画像">
</div>
</details>
<details class="panel advanced">
<summary>詳細設定</summary>
<div class="panel-fields">
<label for="background">好きな背景をアップロード</label>
<input id="background" type="file" accept="image/*">
<label for="font">名前の書体（ボーカル・コンポーザー共通）</label>
<select id="font" autocomplete="off">
<option value="sans">ゴシック</option>
<option value="serif">明朝</option>
<option value="rounded">丸ゴシック</option>
<option value="mono">等幅</option>
</select>
<label class="logo-setting"><input id="show-logo" type="checkbox" checked> First Step Projectロゴを表示</label>
</div>
</details>
</section>
</div>
<footer class="export">
<p id="status" role="status"></p>
<div class="download">
<button id="save" type="button" disabled>画像を保存</button>
<p id="download-status" role="status" aria-live="polite"></p>
</div>
<div class="credit">
<p>Making by ハルミズキ</p>
<a href="https://x.com/halumizuki" target="_blank" rel="noopener noreferrer">@halumizuki</a>
</div>
</footer>
</main>
</body>
</html>
